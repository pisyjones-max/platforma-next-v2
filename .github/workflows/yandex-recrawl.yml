name: Deploy + Search engine recrawl ping (Yandex + IndexNow)

# Деплоит на собственный VDS по SSH, затем пингует Yandex Webmaster и IndexNow.
#
# paths-ignore: коммиты, которые трогают ТОЛЬКО каталог (обновление цен/
# ассортимента ночным парсером), не должны гонять здесь npm run build +
# pm2 reload — каталог теперь читается сайтом с диска в рантайме и
# доставляется на сервер отдельным лёгким шагом внутри parse-catalog.yml
# (см. его "Deploy catalog.json..." — git pull без билда и рестарта).
# Этот воркфлоу запускается только когда реально меняется код сайта.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/catalog/catalog.json'
      - 'public/images/**'
      - 'scripts/.catalog_signature.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: vds-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to VDS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 185.197.75.101
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/platforma-next-v2
            # Один деплой за раз (иначе две параллельные сборки на 2 ГБ убивают сайт)
            exec 9>/tmp/platforma-deploy.lock
            flock -w 1800 9
            git pull origin main
            # npm ci стирает node_modules у работающего сайта — только если lock-файл изменился
            HASH=$(sha256sum package-lock.json | cut -c1-64)
            if [ ! -d node_modules ] || [ "$(cat .npm-lock-hash 2>/dev/null)" != "$HASH" ]; then
              npm ci
              echo "$HASH" > .npm-lock-hash
            fi
            # Билдим в ОТДЕЛЬНОЙ папке: next build стирает .next, и пока он шёл,
            # живой сайт отдавал HTML со ссылками на CSS, которых уже нет (голая страница).
            command -v rsync >/dev/null || apt-get install -y rsync
            LIVE=/var/www/platforma-next-v2
            B=/var/www/platforma-build
            mkdir -p $B
            rsync -a --delete --exclude .git --exclude .next --exclude node_modules --exclude public/images $LIVE/ $B/
            # Turbopack (Next 16) не принимает symlink на node_modules за пределами проекта
            # («points out of the filesystem root») — делаем копию жёсткими ссылками: места не ест, не трогает живой node_modules
            rm -rf $B/node_modules
            cp -al $LIVE/node_modules $B/node_modules
            ln -sfn $LIVE/public/images $B/public/images
            cd $B
            NEXT_PUBLIC_SITE_URL="https://platforma-msk.ru" NODE_OPTIONS="--max-old-space-size=1536" npm run build
            cd $LIVE
            # Подмена .next за миллисекунды + старые чанки остаются,
            # чтобы у открытых/закэшированных страниц CSS не пропадал
            rm -rf .next.new .next.old
            cp -a $B/.next .next.new
            if [ -d .next/static ]; then cp -an .next/static/. .next.new/static/; fi
            find .next.new/static -type f -mtime +14 -delete
            mv .next .next.old 2>/dev/null || true
            mv .next.new .next
            pm2 reload platforma --update-env || pm2 restart platforma --update-env
            rm -rf .next.old

  ping-yandex:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Request recrawl for robots.txt and sitemap.xml
        env:
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          YANDEX_USER_ID: ${{ secrets.YANDEX_USER_ID }}
          YANDEX_HOST_ID: ${{ secrets.YANDEX_HOST_ID }}
          SITE_URL: https://platforma-msk.ru
        run: |
          set -e

          if [ -z "$YANDEX_OAUTH_TOKEN" ] || [ -z "$YANDEX_USER_ID" ] || [ -z "$YANDEX_HOST_ID" ]; then
            echo "::error::Не заданы секреты YANDEX_OAUTH_TOKEN / YANDEX_USER_ID / YANDEX_HOST_ID"
            exit 1
          fi

          for path in "/robots.txt" "/sitemap.xml"; do
            echo "Запрашиваю переобход: ${SITE_URL}${path}"
            curl -sS -X POST \
              "https://api.webmaster.yandex.net/v4/user/${YANDEX_USER_ID}/hosts/${YANDEX_HOST_ID}/recrawl/queue" \
              -H "Authorization: OAuth ${YANDEX_OAUTH_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"url\": \"${SITE_URL}${path}\"}"
            echo ""
          done

      - name: IndexNow ping (Bing, Yandex, Seznam, Naver)
        env:
          SITE_URL: https://platforma-msk.ru
          INDEXNOW_KEY: b5db20f76d0035b1bf4a3289c9b0c9d7
        run: |
          set -e

          echo "Получаю список URL из sitemap.xml..."
          curl -sS "${SITE_URL}/sitemap.xml" \
            | grep -oE '<loc>[^<]+</loc>' \
            | sed -E 's/<\/?loc>//g' \
            | jq -R . | jq -s . > /tmp/urls.json

          COUNT=$(jq 'length' /tmp/urls.json)
          echo "Найдено URL в sitemap: ${COUNT}"

          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::sitemap.xml пуст или недоступен, пингую только главную страницу"
            jq -n --arg u "${SITE_URL}/" '[$u]' > /tmp/urls.json
          fi

          jq -n \
            --arg host "platforma-msk.ru" \
            --arg key "${INDEXNOW_KEY}" \
            --arg keyLocation "${SITE_URL}/${INDEXNOW_KEY}.txt" \
            --slurpfile urlList /tmp/urls.json \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList[0]}' > /tmp/payload.json

          echo "Отправляю IndexNow-пинг ($(jq '.urlList | length' /tmp/payload.json) URL)..."
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @/tmp/payload.json
          echo ""
