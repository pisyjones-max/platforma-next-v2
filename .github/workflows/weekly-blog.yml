name: Weekly blog articles (auto-publish)

# Среда и четверг: 1-2 статьи из content/blog-plan.json, проверка сборки,
# коммит в main и запуск деплоя + пинга Яндекса (yandex-recrawl.yml).
# Случайная пауза до 3 часов, чтобы публикации шли в разное время.
on:
  schedule:
    - cron: '0 6 * * 3,4'
  workflow_dispatch:
    inputs:
      count:
        description: 'Сколько статей сгенерировать (пусто = 1-2 случайно)'
        required: false
        type: string
      no_delay:
        description: 'Без случайной паузы'
        required: false
        type: boolean
        default: true

concurrency:
  group: weekly-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Случайная пауза (только по расписанию)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 10800))

      - run: npm ci

      - name: Генерация статей из плана
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_COUNT: ${{ inputs.count }}
        run: |
          COUNT="${INPUT_COUNT:-$((1 + RANDOM % 2))}"
          echo "Статей в этом запуске: $COUNT"
          node scripts/weekly-articles.mjs "$COUNT"

      - name: Проверка типов и сборка
        run: |
          npx tsc --noEmit
          npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://platforma-msk.ru

      - name: Коммит в main
        run: |
          git config user.name "platforma-blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add content/blog content/blog-plan.json
          git commit -m "blog: автопубликация статей по плану"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 10
          done

      - name: Запуск деплоя и пинга Яндекса
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run yandex-recrawl.yml --ref main
