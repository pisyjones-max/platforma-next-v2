name: Parse mk4s.ru catalog

# Раньше здесь был `schedule: cron '0 0 * * *'` — парсер гонял каждую ночь
# сам по себе, а следом (при изменениях) сразу деплоил catalog.json/картинки
# на прод и пинговал Яндекс/IndexNow на переобход. Это означало лишний
# ночной SSH-деплой на боевой сервер и лишний триггер переобхода почти
# каждую ночь — ровно в то время, когда сайт и так может обходить бот.
# Теперь парсинг + деплой запускаются только вручную, по требованию
# (Actions → Run workflow), никакого автозапуска по расписанию.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run parser
        env:
          REPO_ROOT: ${{ github.workspace }}
        run: python scripts/parser.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Проверка, что сайт с новым каталогом реально собирается
        # Это чисто CI-проверка на одноразовой машине Actions — она никак не
        # затрагивает прод и не может помешать живым посетителям сайта, даже
        # если займёт несколько минут. Ловит битые/неполные записи парсера
        # ДО того, как они уедут на сервер.
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://platforma-msk.ru

      - name: Check for changes
        id: changes
        run: |
          git add public/catalog/catalog.json public/images/ scripts/.catalog_signature.json
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            ADDED=$(git diff --cached --stat | tail -1)
            echo "stats=$ADDED" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "🤖 parser: обновление каталога $(date +'%d.%m.%Y %H:%M') | ${{ steps.changes.outputs.stats }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ВАЖНО: catalog.json больше не вшивается в сборку (см. src/lib/catalog.ts —
      # он читается с диска в рантайме). Поэтому изменение только каталога
      # (даже одна цена) НЕ требует npm run build / pm2 reload на сервере —
      # файл просто докладывается поверх старого, и сайт подхватывает свежие
      # данные сам в течение 10 минут (ISR revalidate), без какого-либо
      # прерывания для тех, кто уже находится на сайте. Полный деплой
      # (yandex-recrawl.yml) запускается отдельно и только при изменении кода
      # — см. paths-ignore в том воркфлоу.
      - name: Deploy catalog.json + новые картинки на сервер (без билда и рестарта)
        if: steps.changes.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 185.197.75.101
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /var/www/platforma-next-v2
            git pull origin main

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "✅ Каталог актуален, изменений нет"

  # yandex-recrawl.yml теперь игнорирует коммиты, которые трогают только
  # каталог (paths-ignore) — иначе он бы всё равно гонял npm run build +
  # pm2 reload на каждое изменение цены, что и была вся суть этой переделки.
  # Но пинг поисковиков после реального изменения каталога (новые товары,
  # изменившиеся цены) всё ещё нужен — поэтому он продублирован здесь.
  ping-search-engines:
    needs: parse
    if: needs.parse.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Request recrawl for robots.txt and sitemap.xml
        env:
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          YANDEX_USER_ID: ${{ secrets.YANDEX_USER_ID }}
          YANDEX_HOST_ID: ${{ secrets.YANDEX_HOST_ID }}
          SITE_URL: https://platforma-msk.ru
        run: |
          set -e

          if [ -z "$YANDEX_OAUTH_TOKEN" ] || [ -z "$YANDEX_USER_ID" ] || [ -z "$YANDEX_HOST_ID" ]; then
            echo "::error::Не заданы секреты YANDEX_OAUTH_TOKEN / YANDEX_USER_ID / YANDEX_HOST_ID"
            exit 1
          fi

          for path in "/robots.txt" "/sitemap.xml"; do
            echo "Запрашиваю переобход: ${SITE_URL}${path}"
            curl -sS -X PUT \
              "https://api.webmaster.yandex.net/v4/user/${YANDEX_USER_ID}/hosts/${YANDEX_HOST_ID}/recrawl/queue" \
              -H "Authorization: OAuth ${YANDEX_OAUTH_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"url\": \"${SITE_URL}${path}\"}"
            echo ""
          done

      - name: IndexNow ping (Bing, Yandex, Seznam, Naver)
        env:
          SITE_URL: https://platforma-msk.ru
          INDEXNOW_KEY: b5db20f76d0035b1bf4a3289c9b0c9d7
        run: |
          set -e

          echo "Получаю список URL из sitemap.xml..."
          curl -sS "${SITE_URL}/sitemap.xml" \
            | grep -oE '<loc>[^<]+</loc>' \
            | sed -E 's/<\/?loc>//g' \
            | jq -R . | jq -s . > /tmp/urls.json

          COUNT=$(jq 'length' /tmp/urls.json)
          echo "Найдено URL в sitemap: ${COUNT}"

          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::sitemap.xml пуст или недоступен, пингую только главную страницу"
            jq -n --arg u "${SITE_URL}/" '[$u]' > /tmp/urls.json
          fi

          jq -n \
            --arg host "platforma-msk.ru" \
            --arg key "${INDEXNOW_KEY}" \
            --arg keyLocation "${SITE_URL}/${INDEXNOW_KEY}.txt" \
            --slurpfile urlList /tmp/urls.json \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList[0]}' > /tmp/payload.json

          echo "Отправляю IndexNow-пинг ($(jq '.urlList | length' /tmp/payload.json) URL)..."
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @/tmp/payload.json
          echo ""
