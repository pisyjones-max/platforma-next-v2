name: Weekly blog from queue (auto-publish)

# Среда и четверг: 2-3 готовые статьи из content/blog-queue/ переносятся в блог,
# проверяется сборка, коммит в main и запуск деплоя + пинга Яндекса.
# Случайная пауза до 3 часов, чтобы публикации шли в разное время.
on:
  schedule:
    - cron: '0 6 * * 3,4'
  workflow_dispatch:
    inputs:
      count:
        description: 'Сколько статей опубликовать (пусто = 2-3 случайно)'
        required: false
        type: string

concurrency:
  group: weekly-blog-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Случайная пауза (только по расписанию)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 10800))

      - run: npm ci

      - name: Публикация статей из очереди
        env:
          INPUT_COUNT: ${{ inputs.count }}
        run: |
          COUNT="${INPUT_COUNT:-$((2 + RANDOM % 2))}"
          echo "Статей в этом запуске: $COUNT"
          node scripts/publish-from-queue.mjs "$COUNT"

      - name: Проверка типов и сборка
        run: |
          npx tsc --noEmit
          npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://platforma-msk.ru

      - name: Коммит в main
        run: |
          git config user.name "platforma-blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add content/blog content/blog-queue
          git commit -m "blog: автопубликация статей из очереди"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 10
          done

      - name: Запуск деплоя и пинга Яндекса
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run yandex-recrawl.yml --ref main
